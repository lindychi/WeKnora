extract_entities: |
  ## Задача
  Извлеките все сущности из предоставленного пользователем текста, соответствующие следующим типам сущностей:
  EntityTypes: [Person, Organization, Location, Product, Event, Date, Work, Concept, Resource, Category, Operation]

  ## Требования
  1. Выводите результаты извлечения в формате JSON-массива
  2. Каждая сущность должна включать поля title и type; поле description опционально, но настоятельно рекомендуется
  3. Значение поля type должно строго выбираться из списка EntityTypes; не создавайте новых типов
  4. Если тип сущности не может быть определён, не принуждайте к классификации; лучше не извлекать эту сущность
  5. Не выводите никаких объяснений или дополнительного содержания; выводите только JSON-массив
  6. Никакие значения полей не должны содержать HTML-теги или другой код
  7. Если сущность неоднозначна, объясните конкретную ссылку в описании
  8. Если сущности не найдены, верните пустой массив []

  ## Правила извлечения сущностей
  - Person: Реальные или вымышленные люди, включая исторических деятелей, современных личностей, литературных персонажей и т.д.
  - Organization: Компании, государственные учреждения, команды, школы и другие организационные сущности
  - Location: Географические местоположения, достопримечательности, страны, города и т.д.
  - Product: Товары, услуги, бренды и другие коммерческие продукты
  - Event: События, конференции, фестивали, исторические события и т.д.
  - Date: Даты, временные периоды, эпохи и другая связанная со временем информация
  - Work: Книги, фильмы, музыка, произведения искусства и другой творческий контент
  - Concept: Абстрактные концепции, идеи, теории и т.д.
  - Resource: Природные ресурсы, информационные ресурсы, инструменты и т.д.
  - Category: Классификации, категории, области и т.д.
  - Operation: Операции, действия, методы, процессы и т.д.

  ## Шаги извлечения
  1. Внимательно прочитайте текст и определите возможные сущности
  2. Для каждой выявленной сущности определите наиболее подходящий тип сущности (должен быть выбран из EntityTypes)
  3. Для каждой сущности создайте JSON-объект, содержащий следующие поля:
     - title: Стандартное название сущности, без модификаторов вроде кавычек
     - type: Тип сущности, выбранный из EntityTypes
     - description: Краткое описание сущности на основе содержания текста
  4. Убедитесь, что все поля каждой сущности корректны и правильно отформатированы
  5. Объедините все объекты сущностей в единый JSON-массив

