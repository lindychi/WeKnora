extract_entities: |
  ## 작업
  사용자가 제공한 텍스트에서 다음 엔티티 유형에 해당하는 모든 엔티티를 추출합니다:
  EntityTypes: [Person, Organization, Location, Product, Event, Date, Work, Concept, Resource, Category, Operation]

  ## 요구사항
  1. 추출 결과는 반드시 JSON 배열 형식으로 출력
  2. 각 엔티티는 title과 type 필드를 포함해야 하며, description 필드는 선택사항이지만 강력히 권장
  3. type 필드의 값은 반드시 EntityTypes 목록에서 선택해야 하며, 새로운 유형 생성 금지
  4. 엔티티 유형을 확정할 수 없는 경우, 강제로 분류하지 않고 해당 엔티티를 추출하지 않는 것이 좋음
  5. 어떤 설명이나 추가 내용도 출력하지 않고, JSON 배열만 출력
  6. 모든 필드 값에 HTML 태그나 기타 코드 포함 금지
  7. 엔티티가 모호한 경우, description에서 구체적인 지칭 설명
  8. 어떤 엔티티도 찾지 못한 경우, 빈 배열 [] 반환

  ## 엔티티 추출 규칙
  - Person: 실제 또는 가상의 인물, 역사적 인물, 현대 인물, 문학 캐릭터 등 포함
  - Organization: 회사, 정부 기관, 팀, 학교 등 조직 엔티티
  - Location: 지리적 위치, 랜드마크, 국가, 도시 등
  - Product: 상품, 서비스, 브랜드 등 상업 제품
  - Event: 이벤트, 회의, 축제, 역사적 사건 등
  - Date: 날짜, 기간, 연대 등 시간 관련 정보
  - Work: 책, 영화, 음악, 예술 작품 등 창작 콘텐츠
  - Concept: 추상적 개념, 사상, 이론 등
  - Resource: 자연 자원, 정보 자원, 도구 등
  - Category: 분류, 카테고리, 분야 등
  - Operation: 작업, 동작, 방법, 과정 등

  ## 추출 단계
  1. 텍스트를 주의 깊게 읽고 가능한 엔티티 식별
  2. 식별된 각 엔티티에 대해 가장 적합한 엔티티 유형 결정 (반드시 EntityTypes에서 선택)
  3. 각 엔티티에 대해 다음 필드를 포함하는 JSON 객체 생성:
     - title: 엔티티의 표준 이름, 인용 부호 등 수식어 제외
     - type: EntityTypes에서 선택한 엔티티 유형
     - description: 해당 엔티티에 대한 간단한 한국어 설명, 텍스트 내용 기반
  4. 각 엔티티의 모든 필드가 올바르고 형식이 적절한지 확인
  5. 모든 엔티티 객체를 하나의 JSON 배열로 병합

